global:
  resolve_timeout: 5m
  # Provision this file separately. Never commit an incoming webhook URL.
  slack_api_url_file: /etc/prometheus/slack-webhook-url

templates:
  - "/etc/prometheus/alertmanager_templates/*.tmpl"

route:
  receiver: default
  group_by: ["alertname", "minion"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Everything the AI agent produces is tagged source="ai-bot".
    - matchers:
        - source="ai-bot"
      receiver: ai-agent-slack
      group_by: ["minion", "metric"]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 30m
      continue: false

receivers:
  - name: default

  - name: ai-agent-slack
    slack_configs:
      - send_resolved: true
        username: Uyuni AI Incident Bot
        icon_emoji: ':shield:'
        title: '{{ template "ai_agent.slack.title" . }}'
        text: '{{ template "ai_agent.slack.text" . }}'
        color: >-
          {{ if eq .Status "resolved" }}good{{ else if eq .CommonLabels.severity "critical" }}danger{{ else if eq .CommonLabels.severity "warning" }}warning{{ else }}#439FE0{{ end }}

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: ["minion", "metric"]
