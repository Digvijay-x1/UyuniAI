prometheus:
  url: "http://52.91.91.80:9090"

alertmanager:
  url: "http://52.91.91.80:9093"

salt_api:
  url: "https://localhost:9080"
  username: "agent"
  password: ""  # set via SALT_API_PASSWORD env var
  eauth: "file"

minions:
  - id: "client"
    instance: "client.digvijayrawat.me:9100"
    apache_instance: "client.digvijayrawat.me:9117"
    postgres_instance: "client.digvijayrawat.me:9187"
  - id: "client2"
    instance: "168.144.177.121:9100"
    apache_instance: "168.144.177.121:9117"
    postgres_instance: "168.144.177.121:9187"

# Cross-minion correlation is topology-gated to prevent unrelated alerts from
# different machines being merged solely because they happened at the same
# time. These edges can later be generated from Uyuni groups or service tags.
dependency_correlation:
  # Prometheus targets scrape independently. Hold a one-sided dependency
  # candidate briefly so adjacent cycles can form one incident.
  grace_seconds: 90
  postgres_apache:
    - postgres_minion: "client"
      apache_minion: "client2"

thresholds:
  memory:
    warning: 70
    critical: 95
    pressure:
      # Current page-in/page-out rates distinguish active swapping from stale
      # swap occupancy. These apply only after memory exceeds warning.
      swap_activity_pages_per_second:
        warning: 1
        critical: 100
      swap_usage_percent:
        warning: 5
        critical: 25
  cpu:
    warning: 70
    critical: 95
  disk:
    warning: 75
    critical: 95
  apache:
    busy_workers_percent:
      warning: 75
      critical: 90
    requests_per_sec:
      warning: 500
      critical: 1000
  postgres:
    active_connections_percent:
      warning: 75
      critical: 90
    deadlocks_per_min:
      warning: 1
      critical: 5
    # Ignore brief lock contention; investigate persistent blocked work.
    blocked_transaction_seconds:
      warning: 5
      critical: 30

llm:
  provider: "tokenrouter"  # "openai", "google_genai", or "huggingface"
  model: "openai/gpt-oss-120b"
  # api_key loaded from env: LLM_API_KEY

logging:
  level: "DEBUG"

polling:
  interval_seconds: 60

service_monitoring:
  enabled: true
  # Optional glob patterns for intentionally failed or masked test units.
  ignored_units: []

postgres_lock_monitoring:
  # Enabled automatically for minions that define postgres_instance.
  # The read-only query discovers every database in that PostgreSQL cluster.
  enabled: true

deduplication:
  # Re-investigate a continuously failing unit only after this interval.
  cooldown_seconds: 900

concurrency:
  max_minions: 8       # minions processed in parallel per cycle
  max_salt_calls: 8   # global cap on concurrent Salt API calls
  max_llm_calls: 5     # cap on concurrent LLM investigations
