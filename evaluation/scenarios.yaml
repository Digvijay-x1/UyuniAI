- id: isolated_cpu_saturation
  level: baseline
  injected_failure: One process consumes sustained CPU without memory pressure, I/O wait, or downstream blocking.
  expected_alerts: [cpu]
  expected_tools: [cpu_pressure_snapshot]
  expectation:
    conclusion: confirmed
    component_pattern: ".+"
    required_concept_groups:
      - ["cpu"]
      - ["process", "workload"]
    forbidden_phrases: ["swap thrashing", "database lock"]
    remediation_concept_groups:
      - ["limit", "load", "process"]
    minimum_evidence_records: 2
    minimum_confidence: 0.7

- id: service_port_conflict
  level: correlation
  injected_failure: A healthy service is stopped while an unrelated process binds its configured TCP port.
  expected_alerts: [service_down]
  expected_tools: [service_details, service_logs, listening_tcp_ports]
  expectation:
    conclusion: confirmed
    component_pattern: "(?i)service|my-web"
    required_concept_groups:
      - ["address already in use", "port conflict", "already listening"]
      - ["tcp port", "listener"]
    forbidden_phrases: ["service is merely inactive"]
    remediation_concept_groups:
      - ["unintended listener", "reconfigure", "port"]
    minimum_evidence_records: 2
    minimum_confidence: 0.8

- id: disk_crash_loop
  level: root_cause_chain
  injected_failure: A restarting systemd unit appends to one log until its filesystem is full.
  expected_alerts: [disk, service_down]
  expected_tools: [disk_usage, largest_files, service_references, service_details, service_logs]
  expectation:
    conclusion: confirmed
    component_pattern: "(?i)service|crash"
    required_concept_groups:
      - ["restart", "crash loop"]
      - ["largest file", "application.log", "log"]
      - ["filesystem", "disk"]
    forbidden_phrases: ["partition is simply full"]
    remediation_concept_groups:
      - ["stop", "halt"]
      - ["rotation", "bounded"]
    minimum_evidence_records: 3
    minimum_confidence: 0.8

- id: postgres_blocked_transaction
  level: correlation
  injected_failure: An idle-in-transaction backend holds a lock required by an active UPDATE.
  expected_alerts: [postgres_blocked_transaction]
  expected_tools: [postgres_health, postgres_blocking_activity]
  expectation:
    conclusion: confirmed
    component_pattern: "(?i)postgres"
    required_concept_groups:
      - ["idle-in-transaction", "idle in transaction"]
      - ["blocked", "lock"]
      - ["accepting queries", "available"]
    forbidden_phrases: ["restart postgresql", "postgresql is stopped"]
    remediation_concept_groups:
      - ["commit", "roll back", "transaction"]
    minimum_evidence_records: 2
    minimum_confidence: 0.8

