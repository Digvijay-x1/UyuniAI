- id: postgres_apache_chain
  level: root_cause_chain
  injected_failure: PostgreSQL lock waits hold application requests and saturate Apache workers on a dependent minion.
  expected_alerts: [postgres_blocked_transaction, apache_busy_workers, postgres_apache_chain]
  expected_tools: [apache_overload_snapshot, postgres_health, postgres_blocking_activity, postgres_connection_activity]
  expectation:
    conclusion: confirmed
    component_pattern: "(?i)postgres"
    required_concept_groups:
      - ["postgres", "database"]
      - ["lock", "blocked"]
      - ["apache", "worker"]
    forbidden_phrases: ["traffic spike", "restart apache"]
    remediation_concept_groups:
      - ["transaction", "blocker"]
    minimum_evidence_records: 3
    minimum_confidence: 0.8

