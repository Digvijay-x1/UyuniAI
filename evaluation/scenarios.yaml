  injected_failure: An independent CPU spike and disk alert occur simultaneously on nodes without a dependency edge.
  expected_alerts: [cpu, disk]
  expected_tools: [cpu_pressure_snapshot, disk_usage, largest_files]
  expectation:
    conclusion: inconclusive
    component_pattern: "(?i)unknown"
    required_concept_groups:
      - ["independent", "no dependency", "inconclusive"]
    forbidden_phrases: ["common root cause confirmed"]
    remediation_concept_groups:
      - ["validate", "repeat", "evidence"]
    minimum_evidence_records: 1
    minimum_confidence: 0.0

